<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Life Record</title>
<style>
:root{font-family:Arial,sans-serif;color:#18181b;background:#fff}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}.app{max-width:390px;min-height:100vh;margin:auto;padding:calc(24px + env(safe-area-inset-top)) 24px calc(112px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:28px;margin:0;font-weight:600}.date{margin-top:64px;font:12px monospace;letter-spacing:3px;color:#71717a}.hero{font-size:48px;font-weight:300;line-height:1.05;margin:18px 0 48px}.tabs{display:flex;border-bottom:1px solid #e4e4e7}.tabs button{border:0;background:white;padding:14px 12px;color:#71717a}.tabs button.active{color:#18181b;border-bottom:2px solid #18181b}.entry{padding:28px 0;border-bottom:1px solid #f4f4f5}.meta{font:11px monospace;letter-spacing:2px;color:#71717a}.entry h2{font-size:19px;margin:12px 0}.entry p{color:#71717a;line-height:1.55}.dock{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:358px;height:80px;border:1px solid #e4e4e7;background:#fff;display:flex;align-items:center;justify-content:space-around}.record{width:56px;height:56px;border-radius:50%;border:1px solid #27272a;background:#0a0a0a;color:white;font-size:22px;transition:all 140ms linear}.record.on{width:164px;border-radius:28px;background:#0a0a0a}.dot{display:none;color:#0047ff}.on .dot{display:inline}.hint{border-left:2px solid #0047ff;padding:14px 18px;color:#71717a;margin-top:22px}.todo{display:flex;gap:12px;align-items:center;padding:18px 0;border-bottom:1px solid #f4f4f5}.todo.done span{text-decoration:line-through;color:#a1a1aa}.settings{margin-top:24px;border-top:1px solid #e4e4e7;padding-top:18px}.settings input{width:100%;padding:14px;border:1px solid #e4e4e7}.small{font-size:12px;color:#71717a;line-height:1.5}
</style></head><body><main class="app"><header><h1>Life Record</h1><button onclick="toggleSettings()" aria-label="Cài đặt">⚙</button></header><div class="date" id="date"></div><div class="hero">Ghi lại.<br>Hiểu sâu hơn.</div><div class="tabs"><button class="active" onclick="show('lesson',this)">Bài học</button><button onclick="show('journal',this)">Nhật ký</button><button onclick="show('todo',this)">Todo</button></div><section id="content"></section><section class="settings" id="settings" hidden><label>Gemini API key</label><input id="key" type="password" placeholder="AIza..." oninput="saveKey()"><p class="small">Key chỉ lưu cục bộ trên điện thoại. Không đưa key vào GitHub.</p></section><div id="hint" class="hint" hidden></div></main><nav class="dock"><button onclick="show('lesson')">▤</button><button id="rec" class="record" onclick="toggleRecord()"><span class="dot">● </span><span id="timer">●</span></button><button onclick="show('todo')">☑</button></nav>
<script>
const data={lesson:[['10:45 · MẠNG MÁY TÍNH','Cách STP chọn Root Bridge','Switch có Bridge ID thấp nhất sẽ trở thành Root Bridge.']],journal:[['08:20 · NHẬT KÝ','Điều cần tập trung tuần này','Hoàn thiện sơ đồ use case và dành ba buổi ôn lại kiến thức VLAN.']],todo:JSON.parse(localStorage.todos||'[["Ôn VLAN",false],["Hoàn thiện use case",false]]')};let recording=false,start=0,tick;
date.textContent=new Intl.DateTimeFormat('vi-VN',{weekday:'long',day:'numeric',month:'long'}).format(new Date()).toUpperCase(); key.value=localStorage.geminiKey||'';
function show(type,el){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));if(el)el.classList.add('active');if(type==='todo'){content.innerHTML=data.todo.map((x,i)=>`<label class="todo ${x[1]?'done':''}"><input type="checkbox" ${x[1]?'checked':''} onchange="done(${i})"><span>${x[0]}</span></label>`).join('')}else content.innerHTML=data[type].map(x=>`<article class="entry"><div class="meta">${x[0]}</div><h2>${x[1]}</h2><p>${x[2]}</p></article>`).join('')}
function done(i){data.todo[i][1]=!data.todo[i][1];localStorage.todos=JSON.stringify(data.todo);show('todo')}
function toggleRecord(){if(!window.LifeRecordNative){notice('Thiết bị không hỗ trợ ghi âm native.');return} recording?LifeRecordNative.stop():LifeRecordNative.requestAndStart()}
function nativeEvent(name,value){if(name==='recording'){recording=true;start=Date.now();rec.classList.add('on');tick=setInterval(()=>{let s=Math.floor((Date.now()-start)/1000);timer.textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`},500)}else{recording=false;clearInterval(tick);rec.classList.remove('on');timer.textContent='●';notice(name==='saved'?'Đã lưu bản ghi cục bộ trên điện thoại.':value)}}
function notice(x){hint.hidden=false;hint.textContent=x}function toggleSettings(){settings.hidden=!settings.hidden}function saveKey(){localStorage.geminiKey=key.value.trim()}show('lesson');
</script></body></html>
